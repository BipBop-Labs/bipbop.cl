services:
  web:
    build: .
    # Sin puertos: el proxy de Coolify llega al contenedor por la red interna
    # usando el EXPOSE 3000 del Dockerfile.
    environment:
      - PORT=3000
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
