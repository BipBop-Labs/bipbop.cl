services:
  web:
    build: .
    # Sin publicar puertos: el proxy de Coolify llega al contenedor por la red
    # interna usando el EXPOSE 3000 del Dockerfile.
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - applications:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  applications:
